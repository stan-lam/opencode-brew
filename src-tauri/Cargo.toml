[package]
name = "opencodebrew"
version = "0.1.0"
description = "A cross-platform IDE with AI assistant and CLI integration"
authors = ["OpenCodeBrew Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "OpenCodeBrew"
path = "src/main.rs"

[lib]
name = "opencodebrew_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["full"] }
git2 = "0.19"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate"] }
futures = "0.3"
walkdir = "2"
notify = "6"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"
md5 = "0.7"
lazy_static = "1.4"
open = "5"
regex = "1"
toml = "0.8"
scraper = "0.18"
url = "2"
urlencoding = "2"
tauri-plugin-http = "2.5.8"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport"] }
pdf-extract = "0.7"
zip = "2.2"
base64 = "0.22"
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3D bracket gradient -->
    <linearGradient id="bracketGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    
    <!-- Highlight gradient for 3D effect -->
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    
    <!-- Shadow gradient -->
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- White background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#ffffff"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Left bracket < -->
  <!-- Shadow layer -->
  <path d="M175 175 L95 256 L175 337" stroke="url(#shadowGradient)" stroke-width="44" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(3, 3)"/>
  <!-- Main bracket -->
  <path d="M175 175 L95 256 L175 337" stroke="url(#bracketGradient)" stroke-width="44" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#dropShadow)"/>
  <!-- Highlight -->
  <path d="M172 181 L100 256 L172 331" stroke="url(#highlightGradient)" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  
  <!-- Forward slash / -->
  <!-- Shadow layer -->
  <path d="M280 155 L232 357" stroke="url(#shadowGradient)" stroke-width="44" fill="none" stroke-linecap="round" transform="translate(3, 3)"/>
  <!-- Main slash -->
  <path d="M280 155 L232 357" stroke="url(#bracketGradient)" stroke-width="44" fill="none" stroke-linecap="round" filter="url(#dropShadow)"/>
  <!-- Highlight -->
  <path d="M276 161 L232 351" stroke="url(#highlightGradient)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Right bracket > -->
  <!-- Shadow layer -->
  <path d="M337 175 L417 256 L337 337" stroke="url(#shadowGradient)" stroke-width="44" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(3, 3)"/>
  <!-- Main bracket -->
  <path d="M337 175 L417 256 L337 337" stroke="url(#bracketGradient)" stroke-width="44" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#dropShadow)"/>
  <!-- Highlight -->
  <path d="M340 181 L412 256 L340 331" stroke="url(#highlightGradient)" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>
